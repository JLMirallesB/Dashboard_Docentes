<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard de análisis de calificaciones para docentes">
    <title>Dashboard Docentes</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">

    <!-- Google Fonts - DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- PapaParse para CSV -->
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js" defer></script>

    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header__left">
            <button id="btn-menu" class="btn btn--icon header__menu-btn" title="Menú" aria-label="Menú" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="header__titles">
                <h1 class="header__title" data-i18n="app.title">Dashboard Docentes</h1>
                <p class="header__subtitle" data-i18n="app.subtitle">Para Conservatorios Elementales y Profesionales de Música</p>
            </div>
        </div>
        <div class="header__actions">
            <button id="btn-add-csv" class="btn btn--icon" title="Añadir CSV" aria-label="Añadir CSV" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            </button>
            <button id="btn-export" class="btn btn--icon" title="Exportar JSON" aria-label="Exportar JSON" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button id="btn-evaluaciones" class="btn btn--icon" title="Gestionar evaluaciones" aria-label="Gestionar evaluaciones" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </button>
            <button id="btn-lang" class="btn btn--text" title="Cambiar idioma" aria-label="Cambiar idioma">
                ES
            </button>
        </div>
    </header>

    <!-- Contenedor principal -->
    <div class="app-container">
        <!-- Overlay para móvil -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar de navegación -->
        <nav class="sidebar" id="sidebar" style="display: none;">
            <button id="btn-collapse" class="sidebar__collapse" title="Colapsar menú" aria-label="Colapsar menú">
                <svg class="icon-collapse" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
                <svg class="icon-expand" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
            </button>
            <ul class="sidebar__nav">
                <li>
                    <a href="#dashboard" class="sidebar__link sidebar__link--active" data-view="dashboard">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        <span data-i18n="nav.dashboard">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="#asignaturas" class="sidebar__link" data-view="asignaturas">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        <span data-i18n="nav.asignaturas">Asignaturas</span>
                    </a>
                </li>
                <li>
                    <a href="#cursos" class="sidebar__link" data-view="cursos">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        <span data-i18n="nav.cursos">Cursos</span>
                    </a>
                </li>
                <li>
                    <a href="#especialidades" class="sidebar__link" data-view="especialidades">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                        <span data-i18n="nav.especialidades">Especialidades</span>
                    </a>
                </li>
                <li>
                    <a href="#matriz" class="sidebar__link" data-view="matriz">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
                        <span data-i18n="nav.matriz">Matriz</span>
                    </a>
                </li>
                <li>
                    <a href="#evolucion" class="sidebar__link" data-view="evolucion">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                        <span data-i18n="nav.evolucion">Evolución</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar__support">
                <a class="sidebar__support-link" href="https://ko-fi.com/miralles" target="_blank" rel="noopener noreferrer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v6a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>
                    <span data-i18n="support.button">Invítame a un café</span>
                </a>
                <span class="sidebar__support-text" data-i18n="support.title">Apoya el proyecto</span>
            </div>
        </nav>

        <!-- Contenido principal -->
        <main class="main-content" id="main-content">
            <!-- El contenido se carga dinámicamente -->
        </main>
    </div>
    <footer class="app-footer">
        <p>
            <span data-i18n="support.footer">¿Te gusta el proyecto? Invítame a un café en</span>
            <a href="https://ko-fi.com/miralles" target="_blank" rel="noopener noreferrer" data-i18n="support.link">Ko-fi</a>
        </p>
    </footer>

    <!-- Modal container -->
    <div class="modal-overlay" id="modal-overlay" style="display: none;">
        <div class="modal" id="modal" role="dialog" aria-modal="true">
            <button class="modal__close" id="modal-close" aria-label="Cerrar">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <div class="modal__content" id="modal-content">
                <!-- Contenido del modal -->
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <!-- Input oculto para archivos -->
    <input type="file" id="file-input-csv" accept=".csv" style="display: none;">
    <input type="file" id="file-input-json" accept=".json" style="display: none;">

    <!-- Scripts -->
    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/csvParser.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/views/welcome.js"></script>
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/asignaturas.js"></script>
    <script src="js/views/cursos.js"></script>
    <script src="js/views/especialidades.js"></script>
    <script src="js/views/matriz.js"></script>
    <script src="js/views/anova.js"></script>
    <script src="js/views/evolucion.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
